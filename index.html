        // 目标图片文件夹名称

        const fallbackImages = [

        // 页面切换
        function navigateTo(viewName) {
            currentView = viewName;

            const homeView = document.getElementById('homeView');
            const studyView = document.getElementById('studyView');
            const floatingBtn = document.getElementById('floatingNextBtn');
            const navHome = document.getElementById('navHomeLink');
            const navStudy = document.getElementById('navStudyLink');

            if (viewName === 'study') {
                window.location.hash = 'study';
                homeView.classList.remove('active-view');
                studyView.classList.add('active-view');
                floatingBtn.style.display = 'flex';
                navHome.classList.remove('active');
                navStudy.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });

                if (currentIndex === -1) {
                    nextWord();
                } else {
                    updateDisplay();
                }
            } else {
                // 回到首页时清理 hash，防止刷新页面时自动跳转
                if (window.location.hash) {
                    try {
                        history.replaceState(null, '', window.location.pathname + window.location.search);
                    } catch (e) {
                        window.location.hash = '';
                    }
                }
                studyView.classList.remove('active-view');
                homeView.classList.add('active-view');
                floatingBtn.style.display = 'none';
                navHome.classList.add('active');
                navStudy.classList.remove('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 动态加载 GitHub 仓库内的图片文件夹

            let owner = "u3823433669-ui";

            const hostname = window.location.hostname;
            const pathname = window.location.pathname;

            if (hostname.endsWith('.github.io')) {
                owner = hostname.replace('.github.io', '');
                const pathParts = pathname.split('/').filter(Boolean);
                if (pathParts.length > 0) {
                    repo = pathParts[0];
                }
            }

            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${IMAGE_FOLDER_NAME}`;
            console.log("正在尝试从 GitHub API 动态加载图片列表:", apiUrl);

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`GitHub API HTTP 状态码: ${response.status}`);
                }
                const data = await response.json();
                if (Array.isArray(data)) {
                    const validExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'];
                    const fetchedImages = data
                        .filter(file => file.type === 'file' && validExtensions.some(ext => file.name.toLowerCase().endsWith(ext)))
                        .map(file => file.name);
                    
                    if (fetchedImages.length > 0) {
                        images = fetchedImages;
                        console.log("🎉 成功加载到 " + images.length + " 个图片:", images);
                    }
                }
            } catch (error) {
                console.warn("使用默认写死的文件名列表:", error);
            }
        }

        let currentIndex = -1;
        let isRevealed = false;
        let isAuthenticated = false; // 初始未认证，不读缓存，确保必须验证
        let lastActionWasRandom = false; 
        const SECRET_PASSWORD = "punta";

        // 滑动相关
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let isSwiped = false;

        // 动态自适应字号
        function fitText(el) {
            const container = el.parentElement;
            if (!container) return;
            const style = window.getComputedStyle(container);
            const paddingLeft = parseFloat(style.paddingLeft);
            const paddingRight = parseFloat(style.paddingRight);
            const maxWidth = container.clientWidth - paddingLeft - paddingRight;
            
            let fontSize = window.innerWidth <= 600 ? 76 : 160; 
            el.style.fontSize = fontSize + 'px';
            
            while (el.offsetWidth > maxWidth && fontSize > 20) {
                fontSize -= 2;
                el.style.fontSize = fontSize + 'px';
            }
        }

        function updateDisplay() {
            const textLabel = document.getElementById('textLabel');
            const imgElement = document.getElementById('displayImage');
            const errorElement = document.getElementById('error');
            const card = document.getElementById('mainCard');
            
            if (currentIndex === -1) return;
            
            const fileName = images[currentIndex];
            const displayName = fileName.split('.')[0];
            const fullPath = IMAGE_FOLDER_NAME + "/" + fileName + "?v=" + new Date().getTime();

            isRevealed = false;
            imgElement.style.display = 'none';
            textLabel.innerText = displayName;
            textLabel.style.display = 'block';
            errorElement.style.display = 'none';
            card.style.backgroundColor = '#ffffff';

            const totalCount = images.length;
            const currentNum = currentIndex + 1;
            const progressPct = totalCount > 0 ? Math.round((currentNum / totalCount) * 100) : 0;
            
            document.getElementById('currentWordNum').innerText = currentNum;
            document.getElementById('totalWordNum').innerText = totalCount;
            document.getElementById('progressPercentage').innerText = progressPct;

            fitText(textLabel);

            imgElement.src = fullPath;
        }

        // 下一个单词（未解锁前只能按顺序看前20个单词，看完第20个单词弹出密码框）
        function nextWord() {
            lastActionWasRandom = false;

            // 如果未认证且当前已经在第20个单词（索引从0开始算，19就是第20个），点击下一个强制拦截并弹出密码提示框
            if (!isAuthenticated && currentIndex >= 19) {
                showAuth();
                return;
            }

            // 第一次进入学习页时，初始化到第1个单词（索引0）
            if (currentIndex === -1) {
                currentIndex = 0;
            } else {
                currentIndex = (currentIndex + 1) % images.length;
            }
            updateDisplay();
        }

        function prevWord() {
            lastActionWasRandom = false;

            // 未输入密码时，只能在前20个单词范围内往回看，严禁从第1个单词向前绕到词库末尾
            if (!isAuthenticated && currentIndex <= 0) {
                return;
            }

            if (currentIndex <= 0) {
                currentIndex = images.length - 1;
            } else {
                currentIndex--;
            }
            updateDisplay();
        }

        function randomWord() {
            lastActionWasRandom = true;
            if (!isAuthenticated) {
                showAuth();
                return;
            }
            
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * images.length);
            } while (newIndex === currentIndex && images.length > 1);
            
            currentIndex = newIndex;
            updateDisplay();
        }

        function handleCardClick() {
            if (isSwiped) {
                isSwiped = false;
                return;
            }
            if (isRevealed) {
                updateDisplay();
            } else {
                revealImage();
            }
        }

        // 手机触屏左右滑动
        const mainCard = document.getElementById('mainCard');
        mainCard.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
            isSwiped = false;
        }, { passive: true });

        mainCard.addEventListener('touchmove', function(event) {
            const currentX = event.changedTouches[0].screenX;
            const currentY = event.changedTouches[0].screenY;
            const diffX = touchStartX - currentX;
            const diffY = Math.abs(touchStartY - currentY);
            
            if (Math.abs(diffX) > 15 || diffY > 15) {
                isSwiped = true;
            }
        }, { passive: true });

        mainCard.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;
            
            const diffX = touchStartX - touchEndX;
            const diffY = Math.abs(touchStartY - touchEndY);
            
            if (diffX > 50 && diffY < diffX) {
                nextWord();
            } else if (diffX < -50 && diffY < Math.abs(diffX)) {
                prevWord();
            }
        }, { passive: true });

        function revealImage() {
            if (currentIndex === -1) return;

            const textLabel = document.getElementById('textLabel');
            const imgElement = document.getElementById('displayImage');
            const card = document.getElementById('mainCard');
            const errorElement = document.getElementById('error');

            if (imgElement.complete && imgElement.naturalHeight === 0) {
                errorElement.style.display = 'block';
                textLabel.style.display = 'none';
            } else {
                textLabel.style.display = 'none';
                imgElement.style.display = 'block';
                card.style.backgroundColor = '#ffffff';
            }
            isRevealed = true;
        }

        // 键盘控制（仅在学习界面生效）
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Escape') {
                closeAuth();
                return;
            }
            if (currentView !== 'study') return;
            if (document.getElementById('authOverlay').style.display === 'flex') return;

            if (e.code === 'Space') {
                e.preventDefault(); 
                handleCardClick();
            } else if (e.code === 'Enter') {
                if (lastActionWasRandom && isAuthenticated) {
                    randomWord();
                } else {
                    nextWord();
                }
            }
        });

        function showAuth() {
            const overlay = document.getElementById('authOverlay');
            overlay.style.display = 'flex';
            const input = document.getElementById('passwordInput');
            input.value = "";
            document.getElementById('authError').style.display = 'none';
            setTimeout(() => input.focus(), 50);
        }

        function closeAuth() {
            document.getElementById('authOverlay').style.display = 'none';
        }

        function verifyPassword() {
            const input = document.getElementById('passwordInput');
            const val = input.value.trim().toLowerCase();
            if (val === SECRET_PASSWORD.toLowerCase()) {
                isAuthenticated = true;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('randomBtn').style.display = 'block';

                // 解锁后立即展示第21个单词
                if (currentIndex === 19) {
                    currentIndex = 20 % images.length;
                } else {
                    currentIndex = (currentIndex + 1) % images.length;
                }
                updateDisplay();
            } else {
                document.getElementById('authError').style.display = 'block';
                input.value = "";
                input.focus();
            }
        }

        window.addEventListener('resize', () => {
            if (currentView !== 'study') return;
            const textLabel = document.getElementById('textLabel');
            if (textLabel && textLabel.style.display !== 'none') {
                fitText(textLabel);
            }
        });

        window.onload = async function() {
            // 清理旧缓存，确保打开或刷新均严格执行20个单词限制
            try {
                sessionStorage.clear();
                localStorage.removeItem('vocab_auth');
            } catch (e) {}

            // 无论任何情况，页面打开一律停留在主页，必须用户主动点击才进入背单词
            if (window.location.hash) {
                try {
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                } catch (e) {
                    window.location.hash = '';
                }
            }
            navigateTo('home');

            await loadDynamicImages();
        };
    </script>
</body>
</html>
